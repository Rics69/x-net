# общие настройки двух инстансов приложения: YAML-якорь &xchat-app объявляем один раз,
# а в сервисах подмешиваем через <<: *xchat-app. Поля x-* compose сам игнорирует
x-xchat-app: &xchat-app
  build:
    context: ${PROJECT_ROOT}
    dockerfile: ${PROJECT_ROOT}/cmd/xchat/Dockerfile
  environment:
    - HTTP_ADDR=:5050
    - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
    - POSTGRES_HOST=xchat-postgres
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
    - LOGGER_LEVEL=${LOGGER_LEVEL}
    - TIME_ZONE=${TIME_ZONE}
    - LOGGER_FOLDER=/app/out/logs
    - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
    - AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL}
    - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
    - RABBITMQ_ENABLED=${RABBITMQ_ENABLED}
    - RABBITMQ_HOST=xchat-rabbitmq
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
  volumes:
    - ${PROJECT_ROOT}/out/logs:/app/out/logs
  # без этого приложение стартует раньше базы, падает на ping и крутится в рестартах.
  # service_healthy = ждать, пока healthcheck зависимости не станет зелёным;
  # если она так и не поднимется, compose сразу скажет "dependency ... is unhealthy"
  depends_on:
    xchat-postgres:
      condition: service_healthy
    xchat-rabbitmq:
      condition: service_healthy
  restart: always

services:
  xchat:
    <<: *xchat-app
    container_name: xchat
    ports:
      - "5050:5050"

  # второй инстанс того же приложения - чтобы руками увидеть, зачем нужен брокер:
  # пост, созданный на :5051, должен прилететь в браузер, открытый на :5050
  xchat-2:
    <<: *xchat-app
    container_name: xchat-2
    ports:
      - "5051:5050"

  xchat-postgres:
    image: postgres:18.6-bookworm
    container_name: xchat-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    # pg_isready проверяет, что постгрес реально принимает подключения, а не просто что процесс жив.
    # $$ - чтобы compose не подставлял переменные сам, а оставил их shell внутри контейнера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  xchat-rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: xchat-env-rabbitmq
    # RabbitMQ хранит данные в папке, названной по имени ноды (= hostname).
    # Без фиксированного hostname после пересоздания контейнера volume окажется "чужим"
    hostname: xchat-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/rabbitmq:/var/lib/rabbitmq
    # 5672 - AMQP для приложения, запущенного на хосте (make xchat-run),
    # 15672 - веб-интерфейс Management UI. Только на 127.0.0.1, наружу не торчат
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # кролик стартует долго (10-20 секунд), ping отвечает только когда нода готова
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  xchat-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: xchat-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:xchat-postgres:5432
    ports:
     - "127.0.0.1:5432:5432"

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.26.5-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code